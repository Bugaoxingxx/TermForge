<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for dark presentation mode -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1724" />
      <stop offset="50%" stop-color="#0A1018" />
      <stop offset="100%" stop-color="#06090D" />
    </linearGradient>

    <!-- Wordmark Gradients -->
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="40%" stop-color="#FF9500" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Optional Dark Canvas -->
  <rect width="960" height="260" rx="16" fill="url(#bannerBg)" />
  <rect width="960" height="260" rx="16" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.15" />

  <!-- Left Side: Scaled Icon Mark (200x200 centered in 240x260) -->
  <g transform="translate(30, 20) scale(0.42)">
    <!-- Squircle Shadow -->
    <rect x="36" y="44" width="440" height="440" rx="104" ry="104" fill="#000000" opacity="0.6" filter="url(#hGlow)" />

    <!-- Squircle Body -->
    <g>
      <rect x="28" y="28" width="456" height="456" rx="108" ry="108" fill="#101B2B" />
      
      <!-- Ambient Spark Fire Glow -->
      <circle cx="280" cy="270" r="140" fill="#FF7A00" opacity="0.45" filter="url(#hGlow)" />

      <!-- Anvil -->
      <path d="M 120 226 C 150 234 186 236 210 236 L 396 236 C 412 236 418 244 416 256 L 412 268 C 390 272 344 286 318 344 C 342 354 380 358 396 372 L 116 372 C 132 358 170 354 194 344 C 168 286 122 272 100 268 L 96 256 C 96 244 104 232 120 226 Z" 
            fill="#2A3C50" stroke="#486581" stroke-width="3" />

      <!-- Anvil Bevel Top -->
      <polygon points="120,226 210,236 396,236 416,220 226,220 102,220" 
               fill="#94A3B8" opacity="0.9" />

      <!-- Prompt '>' and '_' -->
      <g filter="url(#hGlow)">
        <path d="M 216 268 L 254 294 L 216 320" fill="none" stroke="#00F5FF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 274 320 L 306 320" stroke="#00F5FF" stroke-width="14" stroke-linecap="round" />
      </g>

      <!-- Central Spark -->
      <g transform="translate(254, 230)" filter="url(#hGlow)">
        <path d="M 0 -30 Q 0 0 30 0 Q 0 0 0 30 Q 0 0 -30 0 Q 0 0 0 -30 Z" fill="#FFFFFF" />
        <circle cx="0" cy="0" r="10" fill="#FFDD00" />
      </g>

      <!-- Dynamic Sparks -->
      <circle cx="296" cy="190" r="6" fill="#FFAA00" />
      <circle cx="224" cy="176" r="5" fill="#FF4400" />
      <circle cx="334" cy="206" r="5" fill="#FFCC00" />

      <!-- Aero Sheen Arc -->
      <path d="M 28 28 L 484 28 C 484 100 420 190 280 215 C 140 240 28 170 28 28 Z" 
            fill="#FFFFFF" opacity="0.12" />

      <!-- Glass Border -->
      <rect x="28" y="28" width="456" height="456" rx="108" ry="108" 
            fill="none" stroke="#38BDF8" stroke-width="6" stroke-opacity="0.75" />
    </g>
  </g>

  <!-- Right Side: Wordmark & Typography -->
  <g transform="translate(265, 45)">
    <!-- Primary Title: TermForge -->
    <text x="0" y="95" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Montserrat', sans-serif" font-weight="800" font-size="82" letter-spacing="-1">
      <tspan fill="url(#termGrad)" filter="url(#textGlow)">Term</tspan>
      <tspan fill="url(#forgeGrad)">Forge</tspan>
    </text>

    <!-- Version / Architecture Badge -->
    <g transform="translate(480, 48)">
      <rect x="0" y="0" width="148" height="28" rx="14" fill="#0369A1" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1.2" />
      <text x="74" y="19" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#7DD3FC" text-anchor="middle" letter-spacing="1">
        WIN7 AERO + MDI
      </text>
    </g>

    <!-- Tagline (English & Concept) -->
    <text x="4" y="142" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="20" fill="#94A3B8" letter-spacing="1.5">
      TERMINAL WORKSPACE &amp; AGENT CLI
    </text>

    <!-- Secondary Line with Tech Badges -->
    <g transform="translate(4, 162)">
      <text x="0" y="18" font-family="'Segoe UI', 'Microsoft YaHei', sans-serif" font-weight="400" font-size="14" fill="#64748B">
        终端之锻造台 • 原生 ConPTY • WPF 硬件渲染 • 自由停靠
      </text>
    </g>
  </g>
</svg>
