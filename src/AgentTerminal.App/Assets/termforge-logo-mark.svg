<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <radialGradient id="canvasBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#192A3E" />
      <stop offset="60%" stop-color="#0E1622" />
      <stop offset="100%" stop-color="#070A0F" />
    </radialGradient>

    <!-- Aero Glass Border Gradient -->
    <linearGradient id="aeroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5" />
    </linearGradient>

    <!-- Inner Glass Glow Gradient -->
    <radialGradient id="glassInnerGlow" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0369A1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Forge Fire Spark Radial Gradient -->
    <radialGradient id="sparkCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FFD600" />
      <stop offset="60%" stop-color="#FF5D00" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FF0044" stop-opacity="0" />
    </radialGradient>

    <!-- Terminal Cyan Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Forge Heat Glow Filter -->
    <filter id="forgeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Anvil Metallic Body Gradient -->
    <linearGradient id="anvilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4D62" />
      <stop offset="45%" stop-color="#243343" />
      <stop offset="100%" stop-color="#141E28" />
    </linearGradient>

    <!-- Anvil Bevel Highlight -->
    <linearGradient id="anvilBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glass Sheen Linear Gradient (Aero Signature) -->
    <linearGradient id="aeroSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="28" y="28" width="456" height="456" rx="108" ry="108" />
    </clipPath>
  </defs>

  <!-- 1. Drop Shadow under Squircle -->
  <rect x="36" y="44" width="440" height="440" rx="104" ry="104" fill="#000000" opacity="0.6" filter="url(#cyanGlow)" />

  <!-- 2. Main Squircle Body (Clipped for Glass Sheen) -->
  <g clip-path="url(#squircleClip)">
    <!-- Base Dark Obsidian Canvas -->
    <rect x="28" y="28" width="456" height="456" fill="url(#canvasBg)" />
    
    <!-- Subtle Grid / Console Lines Background -->
    <path d="M60 160 H452 M60 256 H452 M60 352 H452 M160 60 V452 M256 60 V452 M352 60 V452" 
          stroke="#38BDF8" stroke-width="1" stroke-opacity="0.08" stroke-dasharray="4 6" />

    <!-- Ambient Forge Fire Glow behind Anvil -->
    <circle cx="280" cy="270" r="140" fill="url(#sparkCore)" opacity="0.55" filter="url(#forgeGlow)" />

    <!-- 3. Stylized Blacksmith Anvil (The "Forge" Element) -->
    <g transform="translate(4, 12)">
      <!-- Anvil Drop Shadow -->
      <path d="M120 376 C130 366 180 360 216 348 C210 310 206 280 186 264 L160 264 C140 264 120 250 110 236 L370 236 C382 250 398 256 414 256 L414 274 C390 274 340 286 312 348 C340 360 380 366 392 376 Z" 
            fill="#05090E" opacity="0.75" transform="translate(0, 10)" />

      <!-- Anvil Main Silhouette -->
      <path d="M 120 226 
               C 150 234 186 236 210 236 
               L 396 236 
               C 412 236 418 244 416 256 
               L 412 268 
               C 390 272 344 286 318 344 
               C 342 354 380 358 396 372 
               L 116 372 
               C 132 358 170 354 194 344 
               C 168 286 122 272 100 268 
               L 96 256 
               C 96 244 104 232 120 226 Z" 
            fill="url(#anvilGrad)" stroke="#223344" stroke-width="2" />

      <!-- Anvil Top Face (Working Surface) - Steely Chamfer with Light -->
      <polygon points="120,226 210,236 396,236 416,220 226,220 102,220" 
               fill="url(#anvilBevel)" opacity="0.95" />
      
      <!-- Hardy Hole on Right Heel -->
      <rect x="364" y="223" width="12" height="9" rx="2" fill="#0A1118" />

      <!-- Anvil Base Highlight Ridge -->
      <path d="M 124 370 L 388 370" stroke="#7DD3FC" stroke-width="2.5" stroke-opacity="0.6" stroke-linecap="round" />
    </g>

    <!-- 4. Terminal Prompt & Cursor (The "Term" Element - Holographic Neon) -->
    <g filter="url(#cyanGlow)">
      <!-- Terminal Chevron '>' Engraved/Floating -->
      <path d="M 216 268 L 254 294 L 216 320" 
            fill="none" stroke="#00F5FF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Terminal Cursor '_' Glowing Underline / Block -->
      <path d="M 274 320 L 306 320" 
            stroke="#00F5FF" stroke-width="12" stroke-linecap="round" />
    </g>

    <!-- 5. Forging Spark Burst (Impact Point - Sparks Flying) -->
    <g transform="translate(254, 232)" filter="url(#forgeGlow)">
      <!-- 4-Point Impact Flare -->
      <path d="M 0 -28 Q 0 0 28 0 Q 0 0 0 28 Q 0 0 -28 0 Q 0 0 0 -28 Z" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="8" fill="#FFF275" />
    </g>

    <!-- Dynamic Flying Ember Sparks -->
    <circle cx="292" cy="196" r="4.5" fill="#FFAA00" filter="url(#cyanGlow)" />
    <circle cx="292" cy="196" r="2" fill="#FFFFFF" />
    <circle cx="230" cy="180" r="3.5" fill="#FF5500" />
    <circle cx="230" cy="180" r="1.5" fill="#FFF" />
    <circle cx="330" cy="210" r="4" fill="#FFCC00" />
    <circle cx="340" cy="265" r="3" fill="#FF7700" />
    <circle cx="180" cy="204" r="2.5" fill="#FFDD33" />

    <!-- Spark Trail Lines -->
    <path d="M 264 224 Q 284 204 314 186" stroke="#FFB703" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 246 222 Q 226 200 210 178" stroke="#FF7700" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
    <path d="M 270 236 Q 310 240 350 252" stroke="#FFDD00" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />

    <!-- 6. Windows 7 Aero Glass Specular Reflection (Top Arc Sheen) -->
    <path d="M 28 28 L 484 28 C 484 100 420 190 280 215 C 140 240 28 170 28 28 Z" 
          fill="url(#aeroSheen)" />

    <!-- Glass Inner Corner Highlights -->
    <circle cx="90" cy="90" r="40" fill="#FFFFFF" opacity="0.08" filter="url(#cyanGlow)" />

    <!-- Top Border High-Gloss Line -->
    <path d="M 136 30 L 376 30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- 7. Outer Aero Glass Dual-Line Bevel Frame -->
  <rect x="28" y="28" width="456" height="456" rx="108" ry="108" 
        fill="none" stroke="url(#aeroBorder)" stroke-width="5" />
  
  <rect x="33" y="33" width="446" height="446" rx="103" ry="103" 
        fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.35" />
</svg>
